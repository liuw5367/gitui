[package]
name = "nsh-app"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
nsh-core = "=0.6.0"
nsh-base = "=0.6.0"
env_logger = "0.11"
log = "0.4"
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
domain = { path = "../../crates/domain" }
git = { path = "../../crates/git" }
store = { path = "../../crates/store" }
agent = { path = "../../crates/agent" }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "=0.6.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[dev-dependencies]
nsh-engine = { version = "=0.6.0", default-features = false }
nsh-testing = { version = "=0.6.0", default-features = false }
